<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FusionClientERP</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        :root {
            --rw-red: #c74634;
            --rw-red-hover: #a83a2b;
            --rw-red-light: #fef4f3;
            --rw-red-dark: #8b2f24;
            --rw-neutral-900: #161513;
            --rw-neutral-800: #312d2a;
            --rw-neutral-700: #4a4744;
            --rw-neutral-500: #6b6966;
            --rw-neutral-400: #8a8886;
            --rw-neutral-300: #b8b6b4;
            --rw-neutral-200: #d5d4d3;
            --rw-neutral-100: #ebebea;
            --rw-neutral-50: #f7f6f6;
            --rw-white: #ffffff;
            --rw-radius: 8px;
            --rw-radius-lg: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Oracle Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--rw-neutral-900) 0%, var(--rw-neutral-800) 50%, var(--rw-neutral-900) 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background decoration */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(199, 70, 52, 0.15) 0%, transparent 60%);
            animation: pulse 15s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(199, 70, 52, 0.1) 0%, transparent 50%);
            animation: pulse 20s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .login-container {
            background: var(--rw-white);
            border-radius: var(--rw-radius-lg);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--rw-red) 0%, var(--rw-red-dark) 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-form {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--rw-neutral-700);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-label .required {
            color: var(--rw-red);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--rw-neutral-300);
            border-radius: var(--rw-radius);
            font-size: 15px;
            color: var(--rw-neutral-800);
            background: var(--rw-neutral-50);
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--rw-red);
            box-shadow: 0 0 0 3px var(--rw-red-light);
            background: var(--rw-white);
        }

        select.form-control {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 18px;
            padding-right: 45px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--rw-neutral-500);
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }

        .password-toggle:hover {
            color: var(--rw-red);
        }

        .alert {
            padding: 14px 16px;
            border-radius: var(--rw-radius);
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
        }

        .alert.show { display: block; animation: slideIn 0.3s ease; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-error { background: #fee2e2; border: 1px solid #fecaca; color: #dc2626; }
        .alert-success { background: #d1fae5; border: 1px solid #a7f3d0; color: #059669; }
        .alert-info { background: var(--rw-red-light); border: 1px solid #fecaca; color: var(--rw-red); }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--rw-red);
            color: white;
            border: none;
            border-radius: var(--rw-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover:not(:disabled) {
            background: var(--rw-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(199, 70, 52, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .spinner.show { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: var(--rw-neutral-500);
            font-size: 13px;
        }

        .version-info {
            text-align: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--rw-neutral-100);
            color: var(--rw-neutral-400);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">O</div>
            <h1>FusionClientERP</h1>
            <p>Enterprise Resource Planning</p>
        </div>

        <div class="login-form">
            <div id="alertBox" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="instanceName">
                        Instance <span class="required">*</span>
                    </label>
                    <select id="instanceName" name="instanceName" class="form-control" required>
                        <option value="PROD">PROD (Production)</option>
                        <option value="TEST">TEST (Testing)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">
                        Username <span class="required">*</span>
                    </label>
                    <input type="text" id="username" name="username" class="form-control"
                        placeholder="Enter your username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">
                        Password <span class="required">*</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <span id="toggleIcon">&#128065;</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText">Sign In</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </form>

            <div class="footer-text">
                Gray's Enterprise Resource Planning
            </div>

            <div class="version-info">
                FusionClientERP v2025.12.01
            </div>
        </div>
    </div>

    <script>
        function log(msg) { console.log('[LOGIN] ' + msg); }

        log('Login page loaded');

        const isWebView2 = !!(window.chrome && window.chrome.webview);
        log('WebView2 available: ' + isWebView2);

        const instanceUrls = {
            'PROD': 'https://g09254cbbf8e7af-graysprod.adb.eu-frankfurt-1.oraclecloudapps.com/ords/WKSP_GRAYSAPP/WAREHOUSEMANAGEMENT',
            'TEST': 'https://g09254cbbf8e7af-graystest.adb.eu-frankfurt-1.oraclecloudapps.com/ords/WKSP_GRAYSAPP/WAREHOUSEMANAGEMENT'
        };

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '&#128584;';
            } else {
                input.type = 'password';
                icon.innerHTML = '&#128065;';
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = 'alert alert-' + type + ' show';
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.remove('show');
        }

        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            btn.disabled = loading;
            spinner.classList.toggle('show', loading);
            btnText.textContent = loading ? 'Signing in...' : 'Sign In';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const instanceName = document.getElementById('instanceName').value;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username) {
                showAlert('Please enter your username', 'error');
                document.getElementById('username').focus();
                return;
            }

            if (!password) {
                showAlert('Please enter your password', 'error');
                document.getElementById('password').focus();
                return;
            }

            setLoading(true);
            log('Attempting login for: ' + username);

            try {
                if (isWebView2) {
                    log('Sending login request to C# backend...');
                    window.chrome.webview.postMessage({
                        action: 'validateLogin',
                        requestId: 'login_' + Date.now(),
                        instanceName: instanceName,
                        username: username,
                        password: password,
                        redirectTo: 'Redwood/home.html'
                    });
                    showAlert('Validating credentials...', 'info');
                } else {
                    log('Making direct API call...');
                    const baseUrl = instanceUrls[instanceName];
                    const loginUrl = baseUrl + '/login?username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password);

                    const response = await fetch(loginUrl, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const items = data.items || [];

                        if (items.length > 0) {
                            const user = items[0];
                            log('Login successful!');
                            showAlert('Login successful! Redirecting...', 'success');

                            localStorage.setItem('erp_loggedIn', 'true');
                            localStorage.setItem('erp_username', username);
                            localStorage.setItem('erp_instanceName', instanceName);
                            localStorage.setItem('erp_loginTime', new Date().toISOString());
                            if (user.user_id) localStorage.setItem('erp_userId', user.user_id);
                            if (user.full_name) localStorage.setItem('erp_fullName', user.full_name);

                            setTimeout(function() {
                                window.location.href = 'home.html';
                            }, 1000);
                        } else {
                            throw new Error('Invalid username or password');
                        }
                    } else {
                        throw new Error('Invalid username or password');
                    }
                }
            } catch (error) {
                log('Login error: ' + error.message);
                showAlert(error.message || 'Login failed. Please try again.', 'error');
                setLoading(false);
            }
        });

        window.handleLoginResponse = function(success, username, instanceName, error) {
            log('handleLoginResponse: success=' + success);
            if (success) {
                showAlert('Login successful! Redirecting...', 'success');
                localStorage.setItem('erp_loggedIn', 'true');
                localStorage.setItem('erp_username', username || '');
                localStorage.setItem('erp_instanceName', instanceName || 'PROD');
                localStorage.setItem('erp_loginTime', new Date().toISOString());
                setTimeout(function() {
                    window.location.href = 'home.html';
                }, 1000);
            } else {
                showAlert(error || 'Invalid username or password', 'error');
                setLoading(false);
            }
        };

        if (isWebView2) {
            window.chrome.webview.addEventListener('message', function(event) {
                const message = event.data;
                if (message.action === 'loginResponse') {
                    window.handleLoginResponse(message.success, message.username, message.instanceName, message.error);
                }
            });
        }

        window.addEventListener('DOMContentLoaded', function() {
            const savedInstance = localStorage.getItem('erp_instanceName');
            if (savedInstance) {
                document.getElementById('instanceName').value = savedInstance;
            }
            if (localStorage.getItem('erp_loggedIn') === 'true') {
                log('Already logged in, redirecting...');
                window.location.href = 'home.html';
            }
        });
    </script>
</body>
</html>
